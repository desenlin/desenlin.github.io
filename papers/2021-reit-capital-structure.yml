abstract: >-
  This paper uses the contrast between the predictable 2007–2009 financial crisis
  and the unexpected COVID-19 shock to test why pre-crisis REIT capital-structure
  adjustments matter. Leverage reduction and maturity extension predicted returns
  during the earlier crisis but not during the pandemic, supporting the interpretation
  that preparation for foreseeable events signals managerial quality.
