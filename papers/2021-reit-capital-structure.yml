abstract: |
  Do capital-structure adjustments reveal managerial skill only when firms can anticipate a crisis? Applying the same REIT sample design and preparation measures to the 2007–2009 financial crisis and the COVID-19 shock, this paper compares a foreseeable downturn with an unexpected one. Reducing leverage and extending debt maturity before 2007 predicted stronger crisis-period returns, but analogous pre-pandemic adjustments did not predict performance during 2020. The contrast suggests that preparation creates value—and signals managerial discipline—when adverse conditions are foreseeable, but should not be expected before truly unanticipated shocks.
