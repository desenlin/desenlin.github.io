#abstract: |
#   Permitted density limits project size but does not determine project entry. We develop a microfounded model linking this distinction to housing production, supply elasticity, and equilibrium prices. The model identifies a benchmark in which permitted density is sufficient and establishes why it is not sufficient in general. Identical permitted density and current construction can conceal different supply responses; entry costs can also affect prices when permitted density is nonbinding. Cross-sectional comparisons assess whether the Wharton Residential Land Use Regulatory Index (WRLURI) adds price information beyond permitted density and market controls. Its contribution is evident in regional comparisons but not within-CBSA county comparisons. The paper identifies the economic information missing from permitted density and provides a framework for evaluating broader regulatory measures.
