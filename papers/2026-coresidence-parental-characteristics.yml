title: "Coresidence: How Parental Characteristics Matter"
year: 2026
category: "publication"
authors:
  - { name: "Arthur Acolin", affiliation: "University of Washington", url: "https://realestate.washington.edu/people/arthur-acolin/" }
  - { name: "Susan Wachter", affiliation: "University of Pennsylvania", url: "https://real-estate.wharton.upenn.edu/profile/wachter/" }
venue: { name: "Real Estate Economics", url: "https://doi.org/10.1111/1540-6229.70028" }
citation: "Acolin, A., Lin, D., & Wachter, S. M. (2026). Coresidence: How parental characteristics matter. Real Estate Economics, 54(3), 701–727. https://doi.org/10.1111/1540-6229.70028"
abstract: |
  This study treats coresidence as a joint decision involving young adults and their parents and asks how parental housing and financial resources shape that outcome. Using longitudinal Panel Study of Income Dynamics data, it relates young-adult coresidence to parental tenure, housing wealth, nonhousing wealth, and household circumstances while accounting for young-adult characteristics and local housing conditions. Greater parental financial capacity is generally associated with a lower likelihood of coresidence, consistent with parents using resources to support independent living, while the availability and characteristics of the parental home also matter.
