abstract: |
  Using detailed Manhattan rental listings, this paper studies how broker size and market intermediation affect rents and listing duration. Apartments represented by larger brokers rent for less and leave the market faster, consistent with better matching and greater search efficiency. A directed-search model with capacity-constrained brokers explains these patterns and clarifies how broker scale shapes equilibrium outcomes. Counterfactual exercises examine policies that encourage brokerage entry and shift commission responsibility to landlords, showing how institutional changes can alter rents, search time, broker concentration, and welfare.
