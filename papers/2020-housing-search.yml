abstract: >-
  Using listing-agent matched data from Manhattan, this paper studies how broker
  listing capacity affects rents and time on market. Larger brokers list at lower
  rents and achieve shorter durations, patterns not fully explained by housing
  amenities. A directed-search model links broker capacity constraints to tenant
  coordination frictions and evaluates brokerage entry and rules shifting commission
  liability from tenants to landlords.
