title: "Mortgage Risk Premiums during the Housing Bubble"
year: 2020
category: "publication"
authors:
  - { name: "Adam Levitin", affiliation: "Georgetown University", url: "https://www.law.georgetown.edu/faculty/adam-j-levitin/" }
  - { name: "Susan Wachter", affiliation: "University of Pennsylvania", url: "https://real-estate.wharton.upenn.edu/profile/wachter/" }
venue: { name: "Journal of Real Estate Finance and Economics", url: "https://doi.org/10.1007/s11146-018-9682-z" }
citation: "Levitin, A. J., Lin, D., & Wachter, S. M. (2020). Mortgage risk premiums during the housing bubble. Journal of Real Estate Finance and Economics, 60(4), 421–468. https://doi.org/10.1007/s11146-018-9682-z"
abstract: |
  Why did mortgage pricing become less responsive to risk during the housing boom? Using private-label securitized mortgages, this study decomposes changes in mortgage spreads and examines how pricing varied with borrower and loan characteristics. The decline in spreads was concentrated among refinance loans and accompanied the expansion of nontraditional mortgage products. Credit scores and loan-to-value ratios became less influential in pricing even as underwriting weakened. The results indicate that the precrisis compression of mortgage risk premiums reflected both changing product composition and diminished sensitivity to observable credit risk.
