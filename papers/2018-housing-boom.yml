abstract: |
  This paper explains why mortgage delinquency rose while mortgage spreads fell during the housing boom. It develops a dynamic general-equilibrium model with borrowers, depositors, and financially constrained intermediaries, and decomposes mortgage spreads into liquidity and default-risk components. Relaxing intermediaries' financing constraints expands credit supply and compresses spreads even as borrower leverage and default risk increase. Quantitative results show that this mechanism can account for key features of the boom and amplify the subsequent bust, linking intermediary balance-sheet conditions to both mortgage pricing and housing-market volatility.
