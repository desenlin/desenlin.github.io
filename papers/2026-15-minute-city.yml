title: "Beyond Proximity in the 15-Minute City: A Behavioral Framework for Local Access, Urban Centers, and Spatial Equity"
year: 2026
category: "working-paper"
status: "Working paper"
authors:
  - { name: "Betty Xiao Wang", affiliation: "University of Hong Kong", url: "https://www.hkubs.hku.hk/people/xiao-wang/" }
  - { name: "Kwan Ok Lee", affiliation: "National University of Singapore", url: "https://discovery.nus.edu.sg/3104-kwan-ok-lee" }
citation: "Lin, D., Wang, B. X., & Lee, K. O. (2026). Beyond proximity in the 15-minute city: A behavioral framework for local access, urban centers, and spatial equity [Working paper]."
abstract: |
  This paper develops a behavioral framework for evaluating the 15-minute city that goes beyond counting nearby amenities. Using mode-specific travel times and origin–destination choice data for New York City, it models where residents access services as a function of proximity, destination quality, supply, and the urban hierarchy of centers. The analysis distinguishes amenities reachable within a short walk from those accessible through longer walking and transit trips and examines how these tradeoffs vary across neighborhoods and travel modes. The framework shows why nominal proximity does not necessarily translate into effective access and provides a basis for measuring spatial equity in polycentric cities.
