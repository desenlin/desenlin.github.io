title: "Land Interventions and Urban Vitality: Evidence from Neighborhood Traffic"
year: 2026
category: "working-paper"
status: "Working paper"
authors:
  - { name: "Shane Jensen", affiliation: "University of Pennsylvania", url: "https://statistics.wharton.upenn.edu/profile/stjensen/" }
  - { name: "Susan Wachter", affiliation: "University of Pennsylvania", url: "https://real-estate.wharton.upenn.edu/profile/wachter/" }
citation: "Lin, D., Jensen, S. T., & Wachter, S. M. (2026). Land interventions and urban vitality: Evidence from neighborhood traffic [Working paper]."
abstract: |
  How do vacant land interventions reshape neighborhood traffic during and after a severe economic shock? Using the COVID-19 pandemic as an exogenous shock to aggregate demand, we compare mobility trajectories around formerly vacant lots that were greened or redeveloped through new construction, relative to lots that remained vacant. Our matched difference-indifferences estimates are consistent with a spatial coordination game characterized by multiple equilibria. We show that the capital required to anchor neighborhood commercial vitality depends on the strength of local network externalities. For agglomeration-sensitive amenities, greening stabilizes nearby visits relative to persistent vacancy, but the rebound in visits is stronger around new construction, suggesting that durable real estate investment provides a stronger anchor for recovery. For other amenities, both interventions mitigate the decline in local visits. These results suggest that vacant land policy should match the intensity of intervention to the structure of local demand: greening offers scalable blight remediation and neighborhood stabilization, while new construction is needed where recovery depends more strongly on agglomeration-sensitive visit activity. 
