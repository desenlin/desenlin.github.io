title: "Land Interventions and Urban Vitality: Evidence from Neighborhood Traffic"
year: 2026
category: "working-paper"
status: "Working paper"
authors:
  - { name: "Shane Jensen", affiliation: "University of Pennsylvania", url: "https://statistics.wharton.upenn.edu/profile/stjensen/" }
  - { name: "Susan Wachter", affiliation: "University of Pennsylvania", url: "https://real-estate.wharton.upenn.edu/profile/wachter/" }
citation: "Lin, D., Jensen, S. T., & Wachter, S. M. (2026). Land interventions and urban vitality: Evidence from neighborhood traffic [Working paper]."
abstract: |
  This paper examines how vacant-land interventions shape neighborhood vitality during and after a severe economic shock. It combines Philadelphia lot-treatment records with SafeGraph visits to nearby points of interest, comparing greened lots, lots converted through construction, and untreated vacant lots across pre-shock, shock, and recovery periods. Greening is associated with greater stability in nearby visits relative to persistent vacancy, while construction produces a stronger rebound. Effects vary by destination type and are especially evident for amenities that draw visitors from outside the immediate neighborhood. Land interventions can strengthen local economic resilience through distinct amenity and development channels.
