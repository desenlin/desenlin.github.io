abstract: |
  This paper studies how local land-use regulation affects housing prices both within a jurisdiction and through neighboring markets. Combining California housing transactions with regulatory measures, it develops a spatial-equilibrium framework that separates the direct productivity effect of regulation from relocation spillovers created when households and development shift across boundaries. The estimates reveal economically meaningful cross-jurisdiction effects: restrictions in nearby communities can raise local demand and prices, while local restrictions redirect activity elsewhere. Analyses that ignore surrounding regulation can therefore misstate both the magnitude and distribution of policy effects.
