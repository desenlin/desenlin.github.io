title: "Vacant Lot Greening as a Long-Term Investment in Legacy Cities? Evidence from the LandCare Program in Philadelphia"
year: 2026
category: "policy-report"
status: "Policy report"
venue: { name: "Lincoln Institute of Land Policy", url: "https://www.lincolninst.edu/publications/working-papers/vacant-lot-greening-long-term-investment-legacy-cities-evidence-landcare-philadelphia/" }
citation: "Lin, D. (2026). Vacant lot greening as a long-term investment in legacy cities? Evidence from the LandCare Program in Philadelphia. Lincoln Institute of Land Policy."
abstract: "Philadelphia’s LandCare Program, initiated in the mid‑1990s by the Pennsylvania Horticultural Society, presents a scalable and cost‑effective approach to addressing urban vacancy and blight through the transformation of neglected lots into maintained green space. This paper reviews the historical context of land vacancy in Philadelphia and charts the development of LandCare from localized pilot efforts to a citywide program integrated into the city’s planning goals. It examines the procedures of vacant lot remediation, outlines the program’s operational and maintenance costs, and presents before-and-after visual evidence of neighborhood change. Two empirical analyses evaluate the program’s economic impacts: one estimates the amenity value capitalized into nearby property prices, and the other explores how greening can reduce time in vacancy by facilitating vacant lot investment. The paper concludes with policy recommendations focusing on funding sustainability, inter-agency coordination, and the removal of legal and administrative barriers of land reuse. The Philadelphia experience offers valuable insights for other post-industrial legacy cities aiming to turn vacant land into a catalyst for neighborhood revitalization and long-term resilience."
