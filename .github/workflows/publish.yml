name: Publish Quarto website

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.10.18'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements-i18n*.txt

      - name: Install bilingual build dependencies
        run: python -m pip install -r scripts/requirements-i18n.txt

      - name: Restore translations, font, and translation model
        uses: actions/cache@v4
        with:
          path: |
            .cache/i18n
            .cache/huggingface
          key: i18n-v1-${{ runner.os }}-${{ hashFiles('scripts/translate_new_text.py', 'scripts/requirements-i18n-machine.txt') }}-${{ github.sha }}
          restore-keys: |
            i18n-v1-${{ runner.os }}-${{ hashFiles('scripts/translate_new_text.py', 'scripts/requirements-i18n-machine.txt') }}-

      - name: Test translation boundaries and change detection
        run: python -m unittest discover -s scripts/i18n-tests -v

      - name: Render website
        run: quarto render

      - name: Find new or changed English text
        id: translation
        run: |
          python scripts/build_bilingual.py --extract
          python -c 'import json; print("needed=" + str(bool(json.load(open(".cache/i18n/missing.json")))).lower())' >> "$GITHUB_OUTPUT"

      - name: Install CPU translation model dependencies when needed
        if: steps.translation.outputs.needed == 'true'
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r scripts/requirements-i18n-machine.txt

      - name: Generate updated Chinese pages and font subsets
        env:
          HF_HOME: .cache/huggingface
          HF_HUB_DISABLE_TELEMETRY: '1'
        run: python scripts/build_bilingual.py --auto

      - name: Verify bilingual pages and protected research records
        run: python scripts/check_bilingual.py

      - name: Save translation report and reusable text
        uses: actions/upload-artifact@v4
        with:
          name: chinese-translation-report
          path: |
            .cache/i18n/report.json
            .cache/i18n/used-translations.json
          retention-days: 30

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Upload website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
