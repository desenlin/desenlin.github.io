name: Analytics tracking audit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Audit the deployed site as well as source coverage
        type: boolean
        default: true
  # Weekly live coverage is scheduled by the private desenlin/site-maintenance
  # coordinator. This workflow retains source, deployment, and manual checks.
  workflow_run:
    workflows: ["Publish Quarto website"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/analytics-reusable.yml
    with:
      live: ${{ github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.live) }}
  public-sites:
    name: Audit ${{ matrix.site }}
    # Changes to the shared engine get source checks; manual runs add live checks.
    # Each site retains its own deployment/manual live audit.
    if: github.event_name != 'workflow_run'
    strategy:
      fail-fast: false
      matrix:
        site: [site-feasibility-sandbox, FIN351, FIN355, ame-quarter, housing-market-lab]
    uses: ./.github/workflows/analytics-reusable.yml
    with:
      repository: desenlin/${{ matrix.site }}
      artifact_name: analytics-audit-${{ matrix.site }}
      live: ${{ github.event_name == 'workflow_dispatch' && inputs.live }}
