name: Analytics tracking audit
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: Audit the deployed site as well as source coverage
        type: boolean
        default: true
  schedule:
    # Weekly live coverage for this site and the three teaching repositories (UTC).
    - cron: "29 17 * * 1"
  workflow_run:
    workflows: ["Publish Quarto website"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
concurrency:
  group: analytics-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/analytics-reusable.yml
    with:
      live: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_run' || (github.event_name == 'workflow_dispatch' && inputs.live) }}
  teaching-sites:
    name: Audit ${{ matrix.site }}
    # Changes to the shared engine get source checks; weekly/manual runs add live checks.
    # Each teaching repository retains its own post-deployment live audit.
    if: github.event_name != 'workflow_run'
    strategy:
      fail-fast: false
      matrix:
        site: [site-feasibility-sandbox, FIN351, ame-quarter]
    uses: ./.github/workflows/analytics-reusable.yml
    with:
      repository: desenlin/${{ matrix.site }}
      artifact_name: analytics-audit-${{ matrix.site }}
      live: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.live) }}
